version: '3.8'

services:
  aquavision:
    build: .
    container_name: aquavision-ai
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8050/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
